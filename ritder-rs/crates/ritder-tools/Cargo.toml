[package]
name = "ritder-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tools ported from Ritder's Python tools: build, make-update, publish-release, make-icon, emulate"

[dependencies]
ritder-core = { path = "../ritder-core" }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

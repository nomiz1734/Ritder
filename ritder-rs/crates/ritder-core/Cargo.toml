[package]
name = "ritder-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure logic ported from Ritder's Lua/Python/Shell code (OTA, framebuffer, evdev, diagnostics, build helpers)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
